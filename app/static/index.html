<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J-dashboard · Amazon Ads</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">J</div>
      <div>
        <div class="brand-name">J-dashboard</div>
        <div class="brand-sub">Amazon Ads</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-label">Аналитика</div>
      <button data-view="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"/></svg>
        Обзор
      </button>
      <button data-view="campaigns">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg>
        Кампании
      </button>
      <button data-view="targets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        Ключи и цели
      </button>
      <button data-view="terms">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        Поисковые термины
      </button>
      <button data-view="placements">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/></svg>
        Размещения
      </button>
      <button data-view="products">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>
        Товары
      </button>
      <div class="nav-label">Контроль</div>
      <button data-view="changes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
        Изменения <span class="count" id="nav-changes"></span>
      </button>
      <button data-view="data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
        Данные
      </button>
    </nav>

    <div class="side-foot">
      <div class="acct">
        <span class="acct-dot"></span>
        <div style="flex:1;min-width:0">
          <select class="acct-select" id="account-select" title="Кабинет"></select>
          <div class="acct-meta" id="acct-meta">—</div>
        </div>
      </div>
      <button class="logout hidden" id="btn-logout" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
        </svg>
        Выйти
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 class="page-title" id="view-title">Обзор</h1>
        <div class="page-sub" id="view-sub">Загрузка данных…</div>
      </div>
      <div class="top-actions">
        <span class="pill" id="pill-days">—</span>
        <span class="pill" id="pill-sync" title="Данные обновляет агент по запросу владельца">обновление — по запросу</span>
      </div>
    </div>

    <section class="filters">
      <div class="seg" id="presets">
        <button data-preset="1">1 день</button>
        <button data-preset="7" class="active">7 дней</button>
        <button data-preset="14">14 дней</button>
        <button data-preset="30">30 дней</button>
        <button data-preset="month">Этот месяц</button>
        <button data-preset="prev_month">Прошлый месяц</button>
        <button data-preset="all">За все время</button>
        <button data-preset="custom">Свой</button>
      </div>
      <div class="dates" id="dates">
        <input type="date" id="date-start">
        <span>—</span>
        <input type="date" id="date-end">
      </div>
      <div class="spacer"></div>
      <select class="select-mini" id="status-filter" title="Статус кампании">
        <option value="">Все статусы</option>
        <option value="ENABLED">ENABLED</option>
        <option value="PAUSED">PAUSED</option>
        <option value="ARCHIVED">ARCHIVED</option>
      </select>
      <div class="picker" id="picker">
        <button class="picker-btn" id="picker-btn">
          <span id="picker-label">Все кампании</span>
          <span class="chev">▾</span>
        </button>
        <div class="picker-panel" id="picker-panel">
          <input class="picker-search" id="picker-search" placeholder="Поиск кампании…">
          <label class="picker-all"><input type="checkbox" id="picker-all" checked> Все кампании</label>
          <div id="picker-list"></div>
          <div class="picker-foot">
            <button class="link-btn" id="picker-clear">Сбросить</button>
            <button class="link-btn" id="picker-apply">Применить</button>
          </div>
        </div>
      </div>
    </section>

    <section id="view"></section>
  </main>
</div>

<div class="tooltip" id="tooltip"></div>

<script src="/static/app.js"></script>
</body>
</html>
