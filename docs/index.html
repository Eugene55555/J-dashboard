<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J-dashboard · Amazon Ads</title>
<link rel="stylesheet" href="static/style.css?v=08e4e78ccfdc">
<link rel="icon" href="static/favicon.svg?v=d088a992238c" type="image/svg+xml">
</head>
<body>
<div class="gate hidden" id="gate">
  <form class="gate-card" id="gate-form" autocomplete="on">
    <div class="brand">
      <div class="brand-mark">J</div>
      <div><div class="brand-name">J-dashboard</div>
        <div class="brand-sub">Amazon Ads · приватный доступ</div></div>
    </div>
    <label for="gate-login">Логин</label>
    <input id="gate-login" required type="text" autocapitalize="none" autocomplete="username">
    <label for="gate-password">Пароль</label>
    <input id="gate-password" required type="password" autocomplete="current-password">
    <button class="btn primary" type="submit" id="gate-btn">Войти</button>
    <div class="gate-err" id="gate-error" role="alert"></div>
  </form>
</div>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">J</div>
      <div>
        <div class="brand-name">J-dashboard</div>
        <div class="brand-sub">Amazon Ads</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-label">Аналитика</div>
      <button data-view="overview" data-short="Обзор">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"/></svg>
        <span class="nav-text">Обзор</span>
      </button>
      <button data-view="campaigns" data-short="Кампании">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg>
        <span class="nav-text">Кампании</span>
      </button>
      <button data-view="targets" data-short="Ключи">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        <span class="nav-text">Ключи и цели</span>
      </button>
      <button data-view="terms" data-short="Термины">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="nav-text">Поисковые термины</span>
      </button>
      <button data-view="placements" data-short="Размещ.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/></svg>
        <span class="nav-text">Размещения</span>
      </button>
      <button data-view="products" data-short="Товары">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>
        <span class="nav-text">Товары</span>
      </button>
      <div class="nav-label">Контроль</div>
      <button data-view="changes" data-short="Изменения">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
        <span class="nav-text">Изменения</span> <span class="count" id="nav-changes"></span>
      </button>
      <button data-view="data" data-short="Данные">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
        <span class="nav-text">Данные</span>
      </button>
    </nav>

    <div class="side-foot">
      <div class="acct">
        <span class="acct-dot"></span>
        <div style="flex:1;min-width:0">
          <select class="acct-select" id="account-select" title="Кабинет"></select>
          <div class="acct-meta" id="acct-meta">—</div>
        </div>
      </div>
      <button class="logout hidden" id="btn-logout" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
        </svg>
        Выйти
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 class="page-title" id="view-title"></h1>
        <div class="page-sub" id="view-sub"></div>
      </div>
      <div class="top-actions">
        <button class="btn ghost filters-toggle" id="filters-toggle" aria-controls="dashboard-filters" aria-expanded="false" type="button">Фильтры ▾</button>
        <span class="pill" id="pill-days">—</span>
        <span class="pill" id="pill-sync" title="Данные обновляет агент по запросу владельца">обновление — по запросу</span>
      </div>
    </div>

    <section class="filters" id="dashboard-filters" aria-label="Фильтры отчёта">
      <div class="seg" id="presets">
        <button data-preset="1">1 день</button>
        <button data-preset="7" class="active">7 дней</button>
        <button data-preset="14">14 дней</button>
        <button data-preset="30">30 дней</button>
        <button data-preset="month">Этот месяц</button>
        <button data-preset="prev_month">Прошлый месяц</button>
        <button data-preset="all">За все время</button>
        <button data-preset="custom">Свой</button>
      </div>
      <div class="dates" id="dates">
        <input type="date" id="date-start" aria-label="Начало периода">
        <span>—</span>
        <input type="date" id="date-end" aria-label="Конец периода">
      </div>
      <div class="dates-err hidden" id="date-error" role="alert"></div>
      <div class="spacer"></div>
      <select class="select-mini" id="status-filter" title="Статус кампании">
        <option value="">Все статусы</option>
        <option value="ENABLED">ENABLED</option>
        <option value="PAUSED">PAUSED</option>
        <option value="ARCHIVED">ARCHIVED</option>
      </select>
      <div class="picker" id="picker">
        <button class="picker-btn" id="picker-btn" aria-expanded="false" aria-controls="picker-panel">
          <span id="picker-label">Все кампании</span>
          <span class="chev">▾</span>
        </button>
        <div class="picker-panel" id="picker-panel" role="dialog" aria-label="Выбор кампаний">
          <input class="picker-search" id="picker-search" type="search" placeholder="Поиск кампании по названию или ID…">
          <div class="picker-count" id="picker-count"></div>
          <label class="picker-all"><input type="checkbox" id="picker-all" checked> Все кампании</label>
          <div id="picker-list"></div>
          <div class="picker-empty hidden" id="picker-empty">Ничего не найдено — измените запрос</div>
          <div class="picker-foot">
            <button class="link-btn" id="picker-found">Выбрать найденные</button>
            <button class="link-btn" id="picker-clear">Сбросить (все кампании)</button>
            <button class="link-btn" id="picker-apply">Применить</button>
          </div>
        </div>
      </div>
    </section>

    <section id="view"></section>
  </main>
</div>

<div class="tooltip" id="tooltip"></div>

<script>window.J_STATIC = { dataUrl: "data.enc.json?v=b3a9804f544a", encrypted: true };</script>
<script src="static/local.js?v=dae57ce91f10"></script>
<script src="static/app.js?v=b86c46151253"></script>
</body>
</html>
